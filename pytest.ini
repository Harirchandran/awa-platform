[pytest]
markers =
    runtime: customer-message runtime and transport regression coverage
    customer_turn: customer-turn routing, workflow continuity, and response contracts
    canonical_transcript: deterministic canonical transcript and cross-channel parity contracts
    channel: browser-chat and WhatsApp transport/normalization contracts
    critical_safety: tenant, entitlement, verification, payment, and truth guards
    integration: tests that cross database, Redis, worker, provider, or HTTP boundaries
    slow: tests whose intentional waits or service setup make them unsuitable for the fast loop

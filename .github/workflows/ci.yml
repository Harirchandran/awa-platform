name: AWA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_real_database_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      AWA_INTEGRATION_MODE: mock
      AUTH_MODE: mock
      WHATSAPP_MODE: mock
      BILLING_MODE: mock
      ENABLE_MOCK_AUTH: "true"
      ENABLE_MOCK_WHATSAPP_SIGNUP: "true"
      ENABLE_MOCK_BILLING: "true"
      DATABASE_URL: postgresql://postgres:ci_only_not_a_real_database_password@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: groq
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt pip-audit
      - name: Audit Python dependencies
        run: pip-audit --local
      - name: Install database client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Initialize test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/sql/supabase_complete.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/sql/docker_run_migrations.sql
      - name: Check syntax
        run: python -m compileall -q backend
      - name: Run pytest suite
        run: python -m pytest backend/tests -q
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t awa-backend:ci ./backend
      - name: Verify image
        run: docker image inspect awa-backend:ci --format '{{.Size}}'
